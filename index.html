<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f6;color:#222}
.box{max-width:340px;margin:10vh auto;padding:20px;background:#fff;border-radius:12px;display:grid;gap:8px}
input,select,button,textarea{font:inherit;padding:8px;border:1px solid #ccc;border-radius:8px;min-width:0}
button{background:#222;color:#fff;border:0;cursor:pointer}
.top{display:flex;gap:8px;padding:10px;background:#fff;flex-wrap:wrap;align-items:center}
.big{font-size:1.2em;font-weight:700;flex:1}
.tabs{display:flex;gap:6px;padding:8px}.tabs button{background:#ddd;color:#222}.tabs .on{background:#222;color:#fff}
.row{display:flex;gap:6px;padding:6px 10px;align-items:center;flex-wrap:wrap}.row input:nth-child(3){flex:2}.row input{flex:1}
.r{background:#fff;margin:4px 10px;border-radius:8px}.r small{color:#666;margin-left:auto}.done{opacity:.4;text-decoration:line-through}
.card{background:#fff;margin:6px 10px;padding:14px;border-radius:10px;display:flex;justify-content:space-between;font-size:1.2em}.mesa{font-weight:700;color:#c0392b}
#banner:not(:empty){background:#e67e22;color:#fff;padding:14px;font-size:1.3em;font-weight:700}
#next{padding:6px 12px;background:#e8f4ea}
.in{background:#d4efdf}.off{background:#ddd;color:#222}.chk{font-size:.7em;background:#222;color:#fff;border-radius:8px;padding:6px 10px;margin-left:8px}
.sticky{position:sticky;top:0;background:#f4f4f6;padding-bottom:4px;z-index:5}#cnt{font-weight:700;font-size:1.1em;padding:6px 10px}
.part{background:#fcf3cf}.red{background:#c0392b}.past{opacity:.65}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50}
.mc{background:#fff;border-radius:14px;padding:18px;width:min(92vw,380px);text-align:center;display:grid;gap:8px}
.warn{background:#c0392b;color:#fff;padding:10px;border-radius:8px;font-weight:700}
#scn{position:fixed;inset:0;background:#000;z-index:60}#scn video{width:100%;height:100%;object-fit:cover}#scn button{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:1.1em}
#alr{position:fixed;inset:0;background:#c0392b;color:#fff;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;text-align:center;padding:20px;animation:bl 1s infinite}
#alr div{font-size:clamp(2rem,9vw,5rem);font-weight:800}#alr button{font-size:2rem;padding:16px 40px;background:#fff;color:#c0392b}
@keyframes bl{50%{background:#8e2a20}}
section{padding:0 10px 30px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,getDoc,onSnapshot,writeBatch,runTransaction,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 1) PEGÁ ACÁ LA CONFIG DE TU PROYECTO FIREBASE
const firebaseConfig={apiKey:"AIzaSyD1te6RssbCBSrtpNisansqa-fGjwQBrxM",authDomain:"timming-fad72.firebaseapp.com",projectId:"timming-fad72",storageBucket:"timming-fad72.firebasestorage.app",messagingSenderId:"376144224070",appId:"1:376144224070:web:62c2813a34fe29f4e70f47"};

const APP_URL='https://timming-zeta.vercel.app';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const S=window.S={tab:'plan',f:'all',plan:'',plans:[],items:[],guests:[],codes:[],events:[],unsubs:[],fired:new Set(),q:''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const canEdit=()=>S.owner||S.sup||S.role=='A';
window.addEventListener('unhandledrejection',ev=>{if(ev.reason?.code=='permission-denied')alert('Sin permiso (permission-denied): las reglas de Firebase no están actualizadas o tu rol no permite esta acción.')});
const evDoc=()=>doc(db,'events',S.eid);
const colE=c=>collection(db,'events',S.eid,c);
const clean=()=>{S.unsubs.forEach(f=>f());S.unsubs=[];S.ev=null;S.items=[];S.guests=[];S.codes=[];S.plans=[];applyTheme()};

onAuthStateChanged(auth,async u=>{
  if(S.joining)return;
  S.owner=false;S.sup=false;S.role=null;
  if(!u)return login();
  if(!u.isAnonymous){const lk=new URLSearchParams(location.search).get('e');if(lk){if(confirm('Abriste un link de acceso para personal del evento. ¿Querés cerrar tu sesión actual (dueño o superadmin) para entrar con ese acceso?')){await signOut(auth);return}history.replaceState(null,'',location.pathname)}
    try{S.owner=(await getDoc(doc(db,'owners',u.uid))).exists();if(S.owner){S.name='Dueño';return listEvents();}
      const sd=await getDoc(doc(db,'superadmins',u.uid));S.sup=sd.exists();if(S.sup){S.name=sd.data().label||'Superadmin';return listEvents()}
    }catch(e){clean();$('#app').innerHTML=`<div class=box><h2>Eventos</h2><p>No se pudo verificar tu rol (${esc(e.code||e.message)}). Revisá tu conexión o que las reglas de Firebase estén publicadas.</p><button onclick="location.reload()">Reintentar</button><button class=off onclick="signOutAll()">Salir</button></div>`;return}
    if(!S.msg)S.msg='Ese usuario no tiene permisos de dueño ni de superadmin.';
    await signOut(auth);return}
  const eid=localStorage.eid;
  if(eid&&!new URLSearchParams(location.search).get('e')){try{const m=await getDoc(doc(db,'events',eid,'members',u.uid));if(m.exists()){S.role=m.data().role;S.name=m.data().name||'Sin nombre';return openEvent(eid);}}catch(e){}}
  login();
});

function login(){clean();const msg=S.msg||'';S.msg='';
  const q=new URLSearchParams(location.search),u=q.get('e')||'',nn=q.get('n')||'';history.replaceState(null,'',location.pathname);
  $('#app').innerHTML=`<div class=box><h2>Eventos</h2><small>Evento</small><input id=evn placeholder="Nombre del evento" value="${esc(u)}"><small>Tu nombre y apellido</small><input id=code placeholder="Nombre y apellido" value="${esc(nn)}"><small>Código de 6 dígitos</small><input id=pin type=password inputmode=numeric maxlength=6 autocomplete=off placeholder="••••••"><button onclick="joinCode()">Entrar</button><hr><button class=off id=owb onclick="showOwner()">Soy dueño o superadmin</button><div id=ow style="display:grid;gap:8px"></div><p id=err>${esc(msg)}</p></div>`;
}
const sl=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
window.showOwner=()=>{document.querySelector('#owb').remove();document.querySelector('#ow').innerHTML=`<small>Dueño o superadmin</small><input id=em type=email autocomplete=off placeholder=Email><input id=pw type=password autocomplete=new-password placeholder=Contraseña><label style="font-size:.85em"><input type=checkbox onchange="document.querySelector('#pw').type=this.checked?'text':'password'"> Mostrar contraseña</label><button onclick="ownerLogin()">Entrar con email</button><button class=off onclick="resetPw()">Olvidé mi contraseña</button>`};
window.ownerLogin=async()=>{
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value.trim();
  if(!em||!pw){$('#err').textContent='Escribí el email y la contraseña.';return}
  try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){
    const c=e.code||'';
    $('#err').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)?'Email o contraseña incorrectos. Si la perdiste, tocá "Olvidé mi contraseña".':c=='auth/too-many-requests'?'Demasiados intentos. Esperá unos minutos o usá "Olvidé mi contraseña".':c=='auth/operation-not-allowed'?'El ingreso con email y contraseña no está activado en Firebase.':c=='auth/network-request-failed'?'Sin conexión a internet.':'No se pudo entrar: '+(c||e.message)}
};
window.resetPw=async()=>{
  const em=$('#em').value.trim().toLowerCase();if(!em){$('#err').textContent='Escribí tu email arriba y volvé a tocar "Olvidé mi contraseña".';return}
  try{await sendPasswordResetEmail(auth,em);$('#err').textContent='Te enviamos un email para crear una contraseña nueva. Revisá también la carpeta de spam.'}catch(e){$('#err').textContent='No se pudo enviar: '+(e.code||e.message)}
};
window.resetSup=async id=>{
  const x=S.sups.find(s=>s.id==id);if(!x)return;
  if(!confirm('Se envía un email a '+x.email+' para que cree una contraseña nueva. ¿Seguro?'))return;
  try{await sendPasswordResetEmail(auth,x.email);alert('Email enviado a '+x.email+'. Que revise también spam.')}catch(e){alert('No se pudo enviar: '+(e.code||e.message))}
};
window.joinCode=async()=>{
  const code=sl($('#evn').value)+'-'+sl($('#code').value)+'-'+$('#pin').value.replace(/\D/g,'');let eid,role;
  try{S.joining=true;if(!auth.currentUser)await signInAnonymously(auth);
    const u=auth.currentUser;const j=await getDoc(doc(db,'joins',code));if(!j.exists())throw 0;if(j.data().blocked){S.joining=false;$('#err').textContent='Acceso bloqueado. Consultá con el organizador.';return}({eid,role}=j.data());S.name=j.data().label||'Sin nombre';await setDoc(doc(db,'events',eid,'members',u.uid),{code,role,name:S.name});
    localStorage.eid=eid;S.joining=false;S.owner=false;S.role=role;openEvent(eid);
  }catch(e){S.joining=false;$('#err').textContent=e===0?'No existe ese acceso. Busqué evento "'+sl($('#evn').value)+'" + nombre "'+sl($('#code').value)+'" + ese código. Revisá que coincidan con los del acceso (en Accesos, tocá el código para verlo).':e.code=='permission-denied'?'Sin permiso (permission-denied). Avisale al organizador: puede ser que las reglas de Firebase estén desactualizadas o que el acceso esté bloqueado.':'No se pudo entrar: '+(e.code||e.message)}
};
window.back=async()=>{if(S.owner||S.sup)return listEvents();localStorage.removeItem('eid');await signOut(auth)};

function listEvents(){
  clean();S.eid=null;
  S.unsubs.push(onSnapshot(collection(db,'events'),s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));drawList()}));
  if(S.owner)S.unsubs.push(onSnapshot(collection(db,'superadmins'),s=>{S.sups=s.docs.map(d=>({id:d.id,...d.data()}));drawList()}));
}
function drawList(){
  $('#app').innerHTML=`<div class=top><span class=big>Mis eventos</span><button onclick="signOutAll()">Salir</button></div><section>
  ${S.owner||S.sup?`<div class=row><input id=en placeholder="Nombre del evento"><input id=ed type=date><select id=cp><option value="">Sin copiar accesos</option>${S.events.map(e=>`<option value="${e.id}">Copiar accesos de: ${esc(e.name)}</option>`).join('')}</select><button onclick="newEv()">Crear</button></div>`:''}`+
  [...S.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>{const past=(e.date||'')<new Date().toLocaleDateString('en-CA');return `<div class="card ${past?'past':''}" onclick="openEvent('${e.id}')"><span><b>${esc(e.name)}</b><br><small>${esc(e.date)}${e.start?' · '+esc(e.start)+(e.end?'–'+esc(e.end):''):''} · ${past?'Finalizado':'Próximo'}</small></span><span><button onclick="event.stopPropagation();waEv('${e.id}')">📲</button> <button onclick="event.stopPropagation();xlsEv('${e.id}')">📊</button> ${S.owner?`<button class=red onclick="event.stopPropagation();delEv('${e.id}')">🗑</button>`:''}</span></div>`}).join('')+(S.owner?`<h3>Superadmins</h3><small>Ven y editan todos los eventos, pero no crean ni eliminan eventos, accesos ni colores.</small><div class=row><input id=sn placeholder="Nombre"><input id=se type=email placeholder="Email"><input id=sp type=password placeholder="Contraseña (6 o más)"><label style="font-size:.85em"><input type=checkbox onchange="document.querySelector('#sp').type=this.checked?'text':'password'"> Mostrar</label><button onclick="mkSup()">Crear superadmin</button></div>`+(S.sups||[]).map(x=>`<div class=card><span>${esc(x.label)}<br><small>${esc(x.email)}</small></span><span><button onclick="shareSup('${x.id}')">📲 WhatsApp</button> <button title="Enviar email para crear una contraseña nueva" onclick="resetSup('${x.id}')">🔑 Nueva contraseña</button> <button class=red onclick="delSup('${x.id}')">✕</button></span></div>`).join(''):'')+`</section>`;
}
window.signOutAll=()=>signOut(auth);
window.newEv=async()=>{
  const n=$('#en').value.trim();if(!n)return;
  if(S.events.some(e=>norm(e.name)==norm(n)))return alert('Ya existe un evento con ese nombre. Usá otro para no mezclar accesos.');
  const r=await addDoc(collection(db,'events'),{name:n,date:$('#ed').value,alerts:[10,5,0]}),src=$('#cp').value;
  if(src){let k=0;
    for(const c of await getAll(src,'codes')){if(c.blocked)continue;
      const id=[sl(n),sl(c.label),c.id.slice(c.id.lastIndexOf('-')+1)].filter(Boolean).join('-');
      await setDoc(doc(db,'events',r.id,'codes',id),{role:c.role,evn:n,label:c.label});
      await setDoc(doc(db,'joins',id),{eid:r.id,role:c.role,label:c.label});k++}
    alert(`Evento creado con ${k} accesos copiados. Entran con el mismo nombre y código, escribiendo el nombre del evento nuevo.`)}
};

window.openEvent=eid=>{
  clean();S.eid=eid;S.tab='plan';S.plan='';S.q='';S.edit=false;S.f='all';S.alert='';closeM();wl();
  S.unsubs.push(onSnapshot(evDoc(),s=>{S.ev=s.data();applyTheme();draw()},()=>{if(!S.owner&&!S.sup){alert('Tu acceso fue bloqueado o el evento terminó.');localStorage.removeItem('eid');signOut(auth)}}));
  S.unsubs.push(onSnapshot(colE('items'),s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
  S.unsubs.push(onSnapshot(colE('guests'),s=>{S.guests=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
  S.unsubs.push(onSnapshot(colE('plans'),s=>{S.plans=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ord||0)-(b.ord||0));draw()}));
  if(S.owner||S.sup)S.unsubs.push(onSnapshot(colE('codes'),s=>{S.codes=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
};

const ts=i=>{const t=i.time||'00:00';return +new Date(S.ev.date+'T'+t)+(t<'06:00'?864e5:0)};
window.u=(c,id,f,v)=>updateDoc(doc(db,'events',S.eid,c,id),{[f]:v});
window.del=(c,id)=>confirm('¿Borrar?')&&deleteDoc(doc(db,'events',S.eid,c,id));
window.setEv=(f,v)=>updateDoc(evDoc(),{[f]:v});
const themeOf=()=>({main:'#222222',bg:'#f4f4f6',alert:'#c0392b',...(S.ev?.theme||{})});
const lum=c=>{const n=parseInt(c.slice(1),16);return(((n>>16)&255)*299+((n>>8)&255)*587+(n&255)*114)/1000};
const applyTheme=()=>{const T=themeOf();let s=document.getElementById('th');if(!s){s=document.createElement('style');s.id='th';document.head.append(s)}
  s.textContent=`body,.sticky{background:${T.bg}}body{color:${lum(T.bg)>140?'#222':'#f4f4f6'}}.top,.card,.box,.mc,.r,#next{color:#222}button,.chk{background:${T.main}}.tabs button,.off{background:#ddd;color:#222}.tabs .on{background:${T.main};color:#fff}.red,.warn{background:${T.alert}}.mesa{color:${T.alert}}#alr{background:${T.alert}}#alr button{color:${T.alert}}`};
window.setTheme=(k,v)=>setEv('theme',{...(S.ev.theme||{}),[k]:v});
window.mkSup=async()=>{
  const em=$('#se').value.trim().toLowerCase(),nm=$('#sn').value.trim(),pw=$('#sp').value.trim();
  if(!em||!nm||pw.length<6)return alert('Poné nombre, email y una contraseña de 6 o más caracteres');
  try{const au=getAuth(initializeApp(firebaseConfig,'sec'+Date.now()));let c;
    try{c=await createUserWithEmailAndPassword(au,em,pw)}catch(e){if(e.code=='auth/email-already-in-use')c=await signInWithEmailAndPassword(au,em,pw);else throw e}
    await setDoc(doc(db,'superadmins',c.user.uid),{email:em,label:nm});await signOut(au);
    if(confirm('Superadmin creado. ¿Compartir el acceso por WhatsApp ahora?'))waSend(supMsg(nm,em,pw));
  }catch(e){alert('No se pudo crear: '+(e.code||e.message)+(e.code=='permission-denied'?'. Las reglas de Firebase publicadas no incluyen superadmins: pegá y publicá el firestore.rules actualizado.':'')+(e.code=='auth/invalid-credential'?'. Ese email ya existe con otra contraseña.':''))}
};
window.blkCode=async(id,v)=>{
  await updateDoc(doc(db,'events',S.eid,'codes',id),{blocked:v});
  try{await updateDoc(doc(db,'joins',id),{blocked:v})}catch(e){}
  if(v)(await getDocs(query(colE('members'),where('code','==',id)))).forEach(d=>deleteDoc(d.ref));
};
window.fixCodes=async()=>{
  let ok=0,fixed=0;const lines=[];
  for(const c of S.codes){
    const j=await getDoc(doc(db,'joins',c.id)),d=j.exists()?j.data():null;
    if(!d||d.eid!==S.eid||d.role!==c.role||(d.label||'')!==(c.label||'')||!!d.blocked!==!!c.blocked){
      await setDoc(doc(db,'joins',c.id),{eid:S.eid,role:c.role,label:c.label||'',...(c.blocked?{blocked:true}:{})});fixed++}else ok++;
    lines.push('• '+c.label+' ('+(c.role=='A'?'Admin':'Funcionario')+'): evento "'+(c.evn||S.ev.name)+'", nombre "'+c.label+'"'+(c.blocked?' [BLOQUEADO]':''));
  }
  alert(ok+' accesos correctos, '+fixed+' reparados.\n\nCada persona entra con:\n'+lines.join('\n')+'\n\n(más su código de 6 dígitos)');
};
window.blkAll=async v=>{if(!confirm(v?'¿Bloquear todos los accesos de este evento?':'¿Activar todos los accesos de este evento?'))return;for(const c of S.codes)await blkCode(c.id,v)};
const waSend=t=>{
  const u='https://wa.me/?text='+encodeURIComponent(t),w=window.open(u,'_blank');
  if(w)return;
  let d=document.querySelector('#modal');if(!d){d=document.createElement('div');d.id='modal';document.body.append(d)}
  d.innerHTML=`<div class=mc><h3>Mensaje listo para enviar</h3><textarea id=wat rows=8 readonly>${esc(t)}</textarea><a href="${u}" target=_blank onclick="setTimeout(closeM,400)" style="background:#25d366;color:#fff;padding:12px;border-radius:8px;text-decoration:none;font-weight:700">Abrir WhatsApp</a><button onclick="document.querySelector('#wat').select();document.execCommand('copy')">Copiar mensaje</button><button class=off onclick="closeM()">Cerrar</button></div>`;
};
const supMsg=(nm,em,pw)=>`*Acceso de superadmin*\nHola ${nm}, este es tu acceso para ver y administrar los eventos:\n${APP_URL}\n\nEmail: ${em}${pw?'\nContraseña: '+pw:''}\n\nEntrá en la parte "Dueño o superadmin" con el botón "Entrar con email".`;
window.shareSup=id=>{const x=S.sups.find(s=>s.id==id);if(!x)return;const pw=prompt('Contraseña para incluir en el mensaje (no se guarda en ningún lado). Dejala vacía para no incluirla:','');if(pw===null)return;waSend(supMsg(x.label,x.email,pw))};
window.delSup=id=>confirm('¿Quitar este superadmin? Pierde el acceso a los eventos.')&&deleteDoc(doc(db,'superadmins',id));
window.setAlerts=v=>setEv('alerts',v.split(',').map(x=>parseInt(x)).filter(x=>x>=0));
window.addItem=()=>addDoc(colE('items'),{time:'12:00',action:'Nuevo momento',resp:'',notes:'',done:false,plan:S.plan});
const dk=x=>norm(x.name)+'|'+norm(x.det);
window.addGuest=()=>{
  const n=(prompt('Nombre y apellido')||'').trim();if(!n)return;
  let det='';const dup=S.guests.find(g=>norm(g.name)==norm(n));
  if(dup){det=(prompt(`Ya existe "${dup.name}"${dup.det?' ('+dup.det+')':''} en Mesa ${dup.table||'—'}. Escribí un detalle para diferenciarlo (ej. segundo apellido, parentesco):`)||'').trim();
    if(!det)return alert('No se agregó: falta el detalle para diferenciarlo.');
    if(S.guests.some(g=>dk(g)==norm(n)+'|'+norm(det)))return alert('Ese nombre con ese detalle ya existe.')}
  addDoc(colE('guests'),{name:n,det,table:'',notes:'',pax:1,inCount:0});
};
window.addCountGuest=()=>{
  const raw=prompt('¿Cuántos invitados entran por acá? (sin nombre ni mesa, para contar llegadas)');
  if(raw===null)return;
  const p=parseInt(raw);if(!p||p<1)return alert('Poné un número mayor a 0.');
  const lbl=(prompt('Etiqueta para identificar este grupo (ej. "Entrada general", "Puerta 2"):','Entrada general')||'').trim()||'Entrada general';
  let name=lbl,i=2;
  while(S.guests.some(g=>norm(g.name)==norm(name)))name=lbl+' '+(i++);
  addDoc(colE('guests'),{name,det:'',table:'',notes:'',pax:p,inCount:0});
};
window.ug=(id,f,v)=>{
  const x=S.guests.find(g=>g.id==id),d=S.guests.find(g=>g.id!=id&&dk(g)==dk({...x,[f]:v}));
  if(d){alert(`Ya existe "${d.name}${d.det?' · '+d.det:''}" (Mesa ${d.table||'—'}). Agregá un detalle para diferenciarlos (ej. segundo apellido, parentesco).`);return drawG()}
  u('guests',id,f,v);
};
window.tab=t=>{S.tab=t;draw(true)};
window.clearAlert=()=>{S.alert='';$('#banner').textContent=''};

function draw(force){
  if(force){clearTimeout(S.dt);return render()}
  clearTimeout(S.dt);S.dt=setTimeout(()=>{
    if(!S.ev)return;
    const gl=$('#gl');
    if(S.tab=='g'&&gl){if(gl.contains(document.activeElement)){S.dirty=1;return}return drawG()}
    if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)){S.dirty=1;return}
    render()},150);
}
function render(){

window.qAdj=async(id,d)=>{

  x.inCount=c;x.arrivedAt=c?Date.now():null;x.arrivedBy=c?S.name:null;

async function impRows(r){
  r=r.filter(x=>x&&x[0]);if(!r.length)return;
  let n=0,m=1,nt=2,p=-1,cd=-1,dt=-1;const h=r[0].map(x=>String(x).toLowerCase());
  if(h.some(x=>/nombre|name|invitado/.test(x))){n=h.findIndex(x=>/nombre|name|invitado/.test(x));m=h.findIndex(x=>/mesa|table/.test(x));nt=h.findIndex(x=>/nota|menu|obs/.test(x));p=h.findIndex(x=>/pax|cantidad|personas|lugares/.test(x));cd=h.findIndex(x=>/codigo|código|qr|pulsera/.test(x));dt=h.findIndex(x=>/detalle|diferenci|dni|parentesco/.test(x));r=r.slice(1)}
  const seen=new Set(S.guests.map(dk)),skip=[];
  r=r.filter(x=>{const nm=String(x[n]??'').replace(/^[\d.\-)\s•]+/,'').trim();if(!nm)return false;const k=norm(nm)+'|'+norm(dt>=0?x[dt]:'');if(seen.has(k)){skip.push(nm);return false}seen.add(k);return true});
  window.skipped=skip;
  for(let i=0;i<r.length;i+=400){const b=writeBatch(db);
    r.slice(i,i+400).forEach(x=>b.set(doc(colE('guests')),{name:String(x[n]??'').replace(/^[\d.\-)\s•]+/,'').trim(),table:m>=0?String(x[m]??'').trim():'',notes:nt>=0?String(x[nt]??''):'',pax:p>=0?(parseInt(x[p])||1):1,inCount:0,det:dt>=0?String(x[dt]??'').trim():'',code:cd>=0?String(x[cd]??'').trim():''}));
    await b.commit();}
  alert(r.length+' invitados cargados'+(skip.length?`\n${skip.length} repetidos omitidos (agregales un detalle y cargalos de nuevo):\n`+skip.slice(0,10).join(', '):''));
}

function beep(){try{S.ac=S.ac||new(window.AudioContext||window.webkitAudioContext)();S.ac.resume();const o=S.ac.createOscillator();o.type='square';o.frequency.value=880;o.connect(S.ac.destination);o.start();setTimeout(()=>o.stop(),500)}catch{}navigator.vibrate?.([400,150,400])}
document.addEventListener('pointerdown',()=>{try{S.ac=S.ac||new(window.AudioContext||window.webkitAudioContext)();S.ac.resume()}catch{}});
window.bigAlert=txt=>{$('#alr')?.remove();clearInterval(S.snd);const d=document.createElement('div');d.id='alr';d.innerHTML=`<div>${esc(txt)}</div><button onclick="stopAlert()">ENTENDIDO</button>`;document.body.append(d);beep();S.snd=setInterval(beep,2000)};
window.stopAlert=()=>{clearInterval(S.snd);$('#alr')?.remove()};
const wl=async()=>{try{S.wl=await navigator.wakeLock?.request('screen')}catch{}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&S.eid)wl()});
function drawNext(){
  const el=$('#next');if(!el||!S.ev?.date)return;
  const now=Date.now(),n=[...S.items].filter(i=>!i.done&&ts(i)>=now-6e4).sort((a,b)=>ts(a)-ts(b))[0];
  el.textContent=n?`Próximo: ${n.time} ${n.action} (en ${Math.max(0,Math.round((ts(n)-now)/6e4))} min)`:'';
}
setInterval(()=>{
  if(!S.ev?.date)return;const now=Date.now();
  (S.ev.alerts||[10,5,0]).forEach(m=>S.items.forEach(i=>{
    if(i.done)return;const k=i.id+m+i.time,t=ts(i)-m*6e4;
    if(now>=t&&now<t+45e3&&!S.fired.has(k)){S.fired.add(k);S.alert=(m?`En ${m} min: `:'AHORA: ')+(i.plan?`[${S.plans.find(p=>p.id==i.plan)?.name||''}] `:'')+i.action;const b=$('#banner');if(b)b.textContent=S.alert;bigAlert(S.alert)}
  }));drawNext();
},10000);
</script></body></html>
